version: '3.8'

services:
  shard_0:
    image: postgres:15-alpine
    container_name: shardmaster_shard_0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shard_0
    ports:
      - "5432:5432"
    command: postgres -c shared_buffers=32MB -c max_connections=100 -c synchronous_commit=off
    deploy:
      resources:
        limits:
          memory: 128M

